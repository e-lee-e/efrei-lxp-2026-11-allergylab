# lot-1.toml — la batterie d'analyste, vingt-quatre questions sur le fichier réel.
#
# Format provisoire : `kit evaluer` arrive avec le lot 2. Les champs retenus sont
# ceux dont cette évaluation aura besoin — l'identifiant, la famille, la question,
# et ce qu'on attend comme nature de réponse. Aucun chiffre attendu ici : la
# valeur juste se calcule en Python, hors modèle, et ne se stocke pas dans le
# dépôt (règle 4 du projet : aucune réponse sur le fichier réel).
#
# `attend` vaut "reponse" ou "abstention". Ce n'est pas le corrigé de la question,
# c'est sa nature : une question dont le fichier ne permet pas la réponse doit
# produire une abstention fondée, et une question qui a une réponse doit en
# produire une.

[[questions]]
id = "struct-1"
famille = "structure"
question = "Combien de lignes compte le tableau ?"
attend = "reponse"

[[questions]]
